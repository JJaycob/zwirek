name: Zwirek bot

on:
  schedule:
    - cron: "2 5 * * *" 
  workflow_dispatch:

permissions:
  contents: write # 🔑 KLUCZ: Daje maszynie uprawnienia do edycji plików w Twoim repozytorium

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python zwirek.py

      # 💾 Tego brakowało! Zapisujemy stan seen.json z powrotem do Twojego repozytorium
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Sprawdzenie, czy skrypt zmodyfikował lub utworzył plik seen.json
          if git status --porcelain | grep -q "seen.json"; then
            git add seen.json
            git commit -m "💾 Aktualizacja bazy danych seen.json [Automated]"
            git push
            echo "Zapisano zaktualizowany plik seen.json w repozytorium."
          else
            echo "Brak nowych promocji, seen.json bez zmian. Pomijam push."
          fi
