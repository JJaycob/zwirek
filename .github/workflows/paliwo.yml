name: PB95 CPN price notifier

on:
  push:
    branches:
      - main
    paths:
      - "paliwo.py"
      - ".github/workflows/paliwo.yml"
      - "requirements.txt"
  schedule:
    # Stałe godziny polskie przez cały rok; GitHub obsługuje strefy IANA i zmianę czasu.
    # Powtarzane próby sprawdzają, czy później opublikowano oficjalny komunikat.
    - cron: "37 14 * * *"
      timezone: "Europe/Warsaw"
    - cron: "28 15 * * *"
      timezone: "Europe/Warsaw"
    - cron: "37 16 * * *"
      timezone: "Europe/Warsaw"
    - cron: "47 16 * * *"
      timezone: "Europe/Warsaw"
    - cron: "7 17 * * *"
      timezone: "Europe/Warsaw"
    - cron: "27 17 * * *"
      timezone: "Europe/Warsaw"
    - cron: "47 17 * * *"
      timezone: "Europe/Warsaw"
    - cron: "7 18 * * *"
      timezone: "Europe/Warsaw"
    - cron: "37 18 * * *"
      timezone: "Europe/Warsaw"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pb95-price-check
  cancel-in-progress: false

jobs:
  check-price:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync latest repository state
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax and date parser
        run: |
          python -m py_compile paliwo.py
          python - <<'PY'
          import paliwo
          from datetime import date
          cases = [
              ("obowiązująca w dniach 11-12 listopada 2026 r.", date(2026, 11, 11), date(2026, 11, 12)),
              ("obowiązująca 10 listopada 2026 r.", date(2026, 11, 10), date(2026, 11, 10)),
              ("obowiązująca w dniach 7-9 listopada 2026 r.", date(2026, 11, 7), date(2026, 11, 9)),
              ("obowiązująca w dniach 31 października - 2 listopada 2026 r.", date(2026, 10, 31), date(2026, 11, 2)),
          ]
          for text, expected_start, expected_end in cases:
              actual = paliwo.extract_validity_period(text, "test")
              assert actual == (expected_start, expected_end), (text, actual)

          assert paliwo.eli_years_for(date(2026, 12, 31)) == [2025, 2026, 2027]
          assert paliwo.eli_years_for(date(2027, 1, 1)) == [2026, 2027]
          print("Date parser and New Year rollover tests passed.")
          PY

      - name: Log schedule trigger
        if: github.event_name == 'schedule'
        run: |
          echo "Scheduled cron: ${{ github.event.schedule }}"
          echo "Runner UTC: $(date -u --iso-8601=seconds)"
          echo "Runner Warsaw: $(TZ=Europe/Warsaw date --iso-8601=seconds)"

      - name: Check official CPN announcement and notify
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CHECK_ONLY: 'false'
        run: python paliwo.py

      - name: Save notification state
        if: always()
        run: |
          if git status --porcelain | grep -q "paliwo_seen.json"; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add paliwo_seen.json
            git commit -m "Save daily PB95 report state"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No state changes."
          fi

      - name: Notify Telegram when workflow fails
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          MESSAGE="⚠️ BOT PB95 – URUCHOMIENIE ZAKOŃCZONE BŁĘDEM
          Data: $(TZ=Europe/Warsaw date '+%d.%m.%Y %H:%M:%S')
          Zdarzenie: ${GITHUB_EVENT_NAME}
          Szczegóły i logi: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --silent --show-error --fail --retry 2 --retry-all-errors --max-time 25 \
            --request POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "disable_web_page_preview=true"
