name: PB95 CPN price notifier

on:
  push:
    branches:
      - main
    paths:
      - "paliwo.py"
      - ".github/workflows/paliwo.yml"
      - "requirements.txt"
  schedule:
    # GitHub may delay scheduled jobs. Retry every 10 minutes around the target time;
    # paliwo.py ignores runs before 16:25 Warsaw time and safely ignores duplicates.
    - cron: "*/10 14,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pb95-price-check
  cancel-in-progress: false

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax and date parser
        run: |
          python -m py_compile paliwo.py
          python - <<'PY'
          import paliwo
          from datetime import date
          cases = [
              ("obowiązująca w dniach 11-12 listopada 2026 r.", date(2026, 11, 11), date(2026, 11, 12)),
              ("obowiązująca 10 listopada 2026 r.", date(2026, 11, 10), date(2026, 11, 10)),
              ("obowiązująca w dniach 7-9 listopada 2026 r.", date(2026, 11, 7), date(2026, 11, 9)),
              ("obowiązująca w dniach 31 października - 2 listopada 2026 r.", date(2026, 10, 31), date(2026, 11, 2)),
          ]
          for text, expected_start, expected_end in cases:
              actual = paliwo.extract_validity_period(text, "test")
              assert actual == (expected_start, expected_end), (text, actual)
          print("Date parser tests passed.")
          PY

      - name: Check official CPN announcement and notify
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python paliwo.py

      - name: Save notification state
        run: |
          if git status --porcelain | grep -q "paliwo_seen.json"; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add paliwo_seen.json
            git commit -m "Save last PB95 price"
            git push
          else
            echo "No state changes."
          fi
